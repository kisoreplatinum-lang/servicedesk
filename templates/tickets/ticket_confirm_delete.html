{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body p-4">
  <h1 class="h4">Delete ticket #{{ object.pk }}?</h1>
  <p class="text-muted">{{ object.title }}</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Delete ticket</button>
    <a class="btn btn-link" href="{% url 'ticket-detail' object.pk %}">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
