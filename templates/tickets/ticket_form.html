{% extends "base.html" %}
{% block title %}{% if object %}Update{% else %}New{% endif %} ticket{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7"><div class="card shadow-sm"><div class="card-body p-4">
  <h1 class="h4 mb-3">{% if object %}Update ticket #{{ object.pk }}{% else %}New ticket{% endif %}</h1>
  <form method="post">{% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button class="btn btn-primary">Save ticket</button>
    <a class="btn btn-link" href="{% url 'ticket-list' %}">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
