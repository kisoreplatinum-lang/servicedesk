{{ form.non_field_errors }}
{% for field in form %}
  <div class="mb-3">
    {% if field.field.widget.input_type == 'checkbox' %}
      <div class="form-check">{{ field }}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
    {% else %}
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
    {% endif %}
    {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
    {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
  </div>
{% endfor %}
