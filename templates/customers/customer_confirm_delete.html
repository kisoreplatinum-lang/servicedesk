{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body p-4">
  <h1 class="h4">Delete {{ object.name }}?</h1>
  <p class="text-muted">This also deletes all of this customer's tickets.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Delete customer</button>
    <a class="btn btn-link" href="{% url 'customer-list' %}">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
