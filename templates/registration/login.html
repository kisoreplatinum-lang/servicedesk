{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm"><div class="card-body p-4">
  <h1 class="h4 mb-3">Log in</h1>
  <form method="post">{% csrf_token %}
    {% include "partials/form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="mt-3 mb-0 small">New customer? <a href="{% url 'signup' %}">Create an account</a></p>
</div></div></div></div>
{% endblock %}
