{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body p-4">
  <h1 class="h4 mb-3">Create a customer account</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button class="btn btn-primary w-100">Create account</button>
  </form>
  <p class="mt-3 mb-0 small">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div></div></div></div>
{% endblock %}
